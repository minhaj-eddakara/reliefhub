# ReliefHub MySQL Production Configuration Profile
# Activate by running: java -jar reliefhub-1.0.0.jar --spring.profiles.active=mysql
# Or in application.properties: spring.profiles.active=mysql

spring.datasource.url=jdbc:mysql://localhost:3306/reliefhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
